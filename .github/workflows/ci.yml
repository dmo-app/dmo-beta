# CI no GitHub: o mesmo scripts/ci/ci-local.sh, com um PostgreSQL descartável
# que só existe durante a execução (nunca a base oficial nem a do ensaio).
name: CI

on:
  pull_request:
  push:
    branches: [main, integracao]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chromium para os testes no browser
        run: |
          python3 -m pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: CI local
        run: bash scripts/ci/ci-local.sh
